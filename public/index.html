<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app">
        <header class="app-header">
            <div>
                <p class="eyebrow">Consulta de videojuegos</p>
                <h1>🎮 GameVault</h1>
            </div>
            <p class="app-description">
                Sistema para registrar, consultar y administrar videojuegos con su género,
                plataforma y año de lanzamiento.
            </p>
        </header>

        <section class="form-section" aria-labelledby="form-title">
            <h2 id="form-title">Nuevo videojuego</h2>

            <form id="game-form" class="game-form">
                <div class="form-group">
                    <label for="game-name">Nombre del videojuego</label>
                    <input type="text" id="game-name" name="name" placeholder="Ej. The Legend of Zelda" required>
                </div>

                <div class="form-group">
                    <label for="game-genre">Género</label>
                    <input type="text" id="game-genre" name="genre" placeholder="Ej. Aventura" required>
                </div>

                <div class="form-group">
                    <label for="game-platform">Plataforma</label>
                    <input type="text" id="game-platform" name="platform" placeholder="Ej. Nintendo Switch" required>
                </div>

                <div class="form-group">
                    <label for="game-developer">Developer</label>
                    <input type="text" id="game-developer" name="developer" placeholder="Ej. Nintendo" required>
                </div>

                <div class="form-group">
                    <label for="game-year">Año de lanzamiento</label>
                    <input type="number" id="game-year" name="year" min="1970" max="2100" placeholder="Ej. 2023" required>
                </div>

                <div class="form-group">
                    <label for="game-price">Price</label>
                    <input type="number" id="game-price" name="price" min="0" step="0.01" placeholder="Ej. 59.99" required>
                </div>

                <button type="submit" class="primary-button">Agregar videojuego</button>
            </form>
        </section>

        <section class="table-section" aria-labelledby="table-title">
            <div class="section-heading">
                <h2 id="table-title">Videojuegos registrados</h2>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Género</th>
                            <th>Plataforma</th>
                            <th>Año</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="games-table-body">
                        <tr>
                            <td colspan="5" class="empty-message">No hay videojuegos registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
